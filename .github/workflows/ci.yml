name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout coil-deflate
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-deflate
          path: .ci/coil-deflate
          ref: 07f945931f89bd97281513b50f7cbfb35111c872

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: Language harness (`coil test`)
        run: coil test --root .ci/coil-deflate/src
